name: Auto Green Contribution

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make changes
      run: |
        echo "Last ping: $(date)" > ping.txt

    - name: Commit and Push
      run: |
        git config --local user.email "your-github-email@example.com"
        git config --local user.name "YourGitHubUsername"
        git add ping.txt
        git commit -m "chore: automated contribution ping [skip ci]" || exit 0
        git push
